name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |-
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain 2>&1 | tee build.log || {
            # Kotlin errors start with "e:" and Gradle explains itself after "* What went wrong".
            grep -E "^e: |^error: |^\* What went wrong|FAILED$|^Caused by:" build.log | head -20 | while IFS= read -r line; do
              echo "::error file=app/build.log::${line//'%'/'%25'}"
            done
            # Unit-test assertion messages live in the JUnit XML, not in build.log.
            python3 .github/scripts/report-unit-failures.py || true
            exit 1
          }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: font-manager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

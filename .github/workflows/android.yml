name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log || {
            tail -10 build.log | while IFS= read -r line; do [ -z "$line" ] || echo "::error::$line"; done
            exit 1
          }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: font-manager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
